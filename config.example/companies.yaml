# Company career pages, read through the hiring systems' official public job APIs.
# Add a company under its system; the id is in its jobs page address:
#   greenhouse  job-boards.greenhouse.io/<id>
#   lever       jobs.lever.co/<id>
#   ashby       jobs.ashbyhq.com/<id>
#   personio    <id>.jobs.personio.de   (for .jobs.personio.com write <id>.com)
#   recruitee   <id>.recruitee.com
#   teamtailor  <id>.teamtailor.com   (or the company's own career domain, e.g. careers.acme.com)
# A board that stops working is reported in the weekly email.
