# Companies whose jobs are never emailed (and never listed as near misses), e.g.
# where you've already applied or don't want to work. Case, spaces and legal
# suffixes are ignored: "GetYourGuide" also blocks "Get Your Guide GmbH".
#
# Write one company per line, each starting with "- ":
#   blocked_companies:
#     - Example Corp
#     - Another Company GmbH
blocked_companies: []

# Longer lists in files (relative to this folder), each with what to do with its jobs:
#   warn   emailed as usual, with a "⚠ <label>" note (also on weekly near misses)
#   block  like blocked_companies above
# A list file has one company per line, other names after "|", "#" for comments:
#   Cair Paravel Systems | Cair Paravel     # founded in Narnia, HQ in Archenland
#   Lantern Waste Labs
#
# company_lists:
#   - file: company_lists/narnia.txt
#     label: Narnian company
#     action: warn
