sion is to unlock global opportunity for every person, team, and business. "])</script><script>self.__next_f.push([1,"Built for the way the world works today, Deel combines HRIS, payroll, compliance, benefits, performance, and equipment management into one seamless platform. With AI-powered tools and a fully owned payroll infrastructure, Deel supports every worker type in 150+ countries\u2014helping businesses scale smarter, faster, and more compliantly.</p><p>Among the largest globally distributed companies in the world, our team of 7,000 spans more than 100 countries, speaks 74 languages, and brings a connected and dynamic culture that drives continuous learning and innovation for our customers.</p><br /><p><strong>Why should you be part of our success story?</strong></p><p>As the fastest-growing Software as a Service (SaaS) company in history, Deel is transforming how global talent connects with world-class companies \u2013 breaking down borders that have traditionally limited both hiring and career opportunities. We're not just building software; we're creating the infrastructure for the future of work, enabling a more diverse and inclusive global economy. In 2024 alone, we paid $11.2 billion to workers in nearly 100 currencies and provided healthcare and benefits to workers in 109 countries\u2014ensuring people get paid and protected, no matter where they are.</p><p>Our momentum is reflected in our achievements and customer satisfaction: CNBC Disruptor 50,&nbsp; Forbes Cloud 100, Deloitte Fast 500, and repeated recognition on Y Combinator's top companies list \u2013 all while maintaining a 4.83 average rating from 15,000 reviews across G2, Trustpilot, Captera, Apple and Google.</p><p>Your experience at Deel will be a career accelerator. At the forefront of the global work revolution, you'll tackle complex challenges that impact millions of people's working lives. With our momentum\u2014backed by a $17.3 billion valuation and $1 B in Annual Recurring Revenue (ARR) in just over five years\u2014you'll drive meaningful impact while building expertise that makes you a sought-after leader in the transformation of global work.</p><br /><p>We're growing fast in product and customers, and we need a DevOps Team Lead who loves automation and next-gen infrastructure to help us scale. </p><p></p><p><strong>Responsibilities</strong></p><ul><li><p>Lead and mentor a global team of DevOps engineers</p></li><li><p>Partner with developers, CloudOps and automation engineers to improve efficiency, scale, reliability and observability across Deel's architecture</p></li><li><p>Continuously improve CI/CD, IaC and monitoring</p></li><li><p>Own multiple AWS environments across accounts, including governance, security (IAM, secrets, compliance) and cost optimization</p></li><li><p>Own reliability: on-call, incident response, post-mortems, SLOs, disaster recovery and capacity planning</p></li><li><p>Build self-service tooling and golden paths so engineers can work independently, within shared standards</p></li><li><p>Identify bottlenecks and automation opportunities, then implement the fixes</p></li><li><p>Set priorities and report to engineering leadership</p></li></ul><p><strong>Requirements</strong></p><ul><li><p>2+ years managing DevOps/SRE/Platform teams, and 5+ years as a DevOps engineer</p></li><li><p>Deep knowledge of AWS - multi-account setups, Managed services ( CloudFront \\ RDS \\ Elasticache ) including AWS networking skills (VPC, DNS, load balancing, service mesh).</p></li><li><p>Deep hands-on Kubernetes expertise (EKS): Cluster design, upgrades and multi-cluster operations, including Service mesh, Crossplane, and Cluster Autoscalers,ingress controllers, network policies, RBAC, and workload security and resource tuning.</p>"])</script></body></html>
