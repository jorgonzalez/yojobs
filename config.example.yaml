# yojobs example configuration
# ----------------------------
# Copy this file to config.yaml and edit it: cp config.example.yaml config.yaml
# config.yaml is git-ignored, so your email address and searches stay private.
#
# The active settings below are one complete working setup: leadership roles in
# platform / infrastructure, on-site in Berlin or remote in Europe. Lines starting
# with "#" are alternatives you can uncomment. Duplicate keys are an error (yojobs
# refuses to start rather than silently using one of them).

# ---------------------------------------------------------------------------
# How far back to look
# ---------------------------------------------------------------------------
# Only keep jobs published within the last N days (decimals allowed, e.g. 0.5).
# Scheduled runs automatically widen this to cover the time since the last run.
max_age_days: 3
# The very first run (nothing remembered yet) looks further back.
first_run_days: 30

# ---------------------------------------------------------------------------
# Automatic runs (macOS launchd; install with ./scripts/install-launchd.sh)
# ---------------------------------------------------------------------------
# launchd checks every 30 minutes; a run happens only between earliest and
# latest, at most max_runs_per_day, at least min_gap_hours apart. Missed runs are
# not caught up and each day starts fresh.
schedule:
  earliest: "06:30"
  latest: "22:00"
  min_gap_hours: 5
  max_runs_per_day: 3
  # Examples:
  #   once a day, in the morning:   {earliest: "07:00", latest: "12:00", max_runs_per_day: 1}
  #   every 3 hours, office hours:  {earliest: "08:00", latest: "18:00", min_gap_hours: 3, max_runs_per_day: 4}

# ---------------------------------------------------------------------------
# Email
# ---------------------------------------------------------------------------
# The password is NOT stored here: it is read from the macOS Keychain (service
# "yojobs-smtp", account = username). For Gmail, enable 2-step verification,
# create an App Password (myaccount.google.com/apppasswords), then run:
#   security add-generic-password -U -s yojobs-smtp -a you@gmail.com -w
# and paste the App Password when asked.
email:
  username: you@gmail.com     # account used to log in and send
  to: you@gmail.com           # where alerts go (can be a different address)
  # from: you@gmail.com       # optional, defaults to username
  smtp_host: smtp.gmail.com
  smtp_port: 465              # SSL
  # Other providers (SSL on port 465), e.g.:
  #   Fastmail:  smtp_host: smtp.fastmail.com
  #   iCloud:    use an app-specific password; iCloud needs STARTTLS on 587, which is not supported yet

# ---------------------------------------------------------------------------
# Duplicates
# ---------------------------------------------------------------------------
# Remembers jobs already emailed (git-ignored). A job's URL is never sent twice;
# the same company + title (e.g. on another portal) is blocked for dedupe_days.
database: seen.sqlite
dedupe_days: 60

# ---------------------------------------------------------------------------
# Sources (job portals)
# ---------------------------------------------------------------------------
# Set enabled: false to skip one. Run a single source while testing:
#   python -m yojobs --source remotive --days 7
sources:
  # Remote-only boards
  remotive:       {enabled: true}   # max ~4 runs/day per Remotive's terms
  remoteok:       {enabled: true}   # latest ~100; terms: credit Remote OK + link to the job (the email does)
  himalayas:      {enabled: true, max_pages: 20}
    # searches each required keyword (all_of) and stops once jobs are older than
    # the window; mode: browse reads the general feed instead (slower, fewer hits)
  jobicy:         {enabled: true, count: 100}
    # optional region filter on Jobicy's side, e.g. geo: europe | germany | usa
  weworkremotely: {enabled: true}
    # optional: one category feed instead of all jobs, e.g.
    # url: https://weworkremotely.com/categories/remote-devops-sysadmin-jobs.rss
  workingnomads:  {enabled: true}
  euremotejobs:   {enabled: true}   # homepage (latest ~60); job pages opened only for matches
    # delay_seconds: 3              # pause between job pages (be polite)
  hackernews:     {enabled: true, threads: 2}   # monthly "Who is hiring?" threads (latest 2)

  # Europe / startups
  landingjobs:    {enabled: true, max_pages: 6}
  4dayweek:       {enabled: true}   # no descriptions: all_of words marked 'not verified'
  startupmap:     {enabled: true}   # Berlin startup map; no descriptions
  berlinstartupjobs: {enabled: true}
    # feeds: [https://berlinstartupjobs.com/engineering/feed/]   # default: engineering + all jobs
  welcometothejungle: {enabled: true}  # sitemaps only (job pages are bot-protected): Berlin jobs, no descriptions

  # Company career pages via the official Greenhouse / Lever / Ashby job APIs.
  # Add a company as "<system>:<board id>"; the id is in its jobs page URL:
  #   job-boards.greenhouse.io/<id>  ->  "greenhouse:<id>"
  #   jobs.lever.co/<id>             ->  "lever:<id>"
  #   jobs.ashbyhq.com/<id>          ->  "ashby:<id>"
  # A board that doesn't exist (or moved) is reported in the output and skipped.
  companies:
    enabled: true
    boards: [
      # remote-first / infrastructure & developer-tool companies
      "greenhouse:gitlab", "greenhouse:grafanalabs", "greenhouse:elastic", "greenhouse:datadog",
      "greenhouse:mongodb", "greenhouse:canonical", "greenhouse:vercel", "ashby:clickhouse",
      "greenhouse:cloudflare", "greenhouse:tailscale", "ashby:supabase", "ashby:posthog",
      "ashby:temporal", "greenhouse:chainguard", "greenhouse:upbound", "greenhouse:mattermost",
      "ashby:kong", "greenhouse:cockroachlabs", "ashby:weaviate", "ashby:airbyte",
      "greenhouse:planetscale", "greenhouse:netlify", "ashby:sentry", "greenhouse:honeycomb",
      "greenhouse:circleci", "greenhouse:jetbrains", "greenhouse:neo4j", "ashby:influxdata",
      "ashby:tigerdata", "ashby:doppler", "lever:sysdig", "lever:scaleway", "greenhouse:ionos",
      "ashby:zapier", "ashby:buffer", "greenhouse:ghost", "ashby:oyster", "lever:toptal",
      "ashby:camunda", "ashby:miro",
      # Berlin / Germany / EU tech companies
      "greenhouse:n26", "greenhouse:contentful", "ashby:getyourguide", "greenhouse:hellofresh",
      "greenhouse:sumup", "greenhouse:raisin", "greenhouse:celonis", "ashby:n8n", "ashby:upvest",
      "ashby:pliant", "ashby:taktile", "ashby:parloa", "ashby:enpal", "ashby:trawa",
      "ashby:lyceum", "greenhouse:solarisbank", "greenhouse:grover", "ashby:forto", "ashby:choco",
      "greenhouse:wolt", "greenhouse:bitpanda", "greenhouse:gocardless", "greenhouse:wise",
      "greenhouse:monzo", "lever:agicap", "ashby:mimica",
      # cloud / infrastructure / developer tools / security (added 2026-11-17)
      "greenhouse:harnessinc", "ashby:snyk", "ashby:render", "ashby:railway",
      "greenhouse:digitalocean98", "greenhouse:fastly", "greenhouse:newrelic",
      "greenhouse:pagerduty", "greenhouse:launchdarkly", "greenhouse:jfrog", "ashby:coder",
      "ashby:kubermatic", "greenhouse:platformsh", "ashby:redis", "greenhouse:yugabyte",
      "greenhouse:starburst", "ashby:prefect", "ashby:astronomer", "ashby:anyscale", "ashby:modal",
      "greenhouse:cribl", "greenhouse:nebius", "ashby:lambda", "greenhouse:coreweave",
      "greenhouse:nirmata", "greenhouse:stacklok", "greenhouse:tines", "ashby:vanta",
      "ashby:drata", "ashby:1password", "greenhouse:bitwarden", "greenhouse:buildkite",
      "ashby:docker", "ashby:semgrep", "ashby:linear", "greenhouse:figma", "ashby:notion",
      "ashby:tremendous", "ashby:elevenlabs",
      # more European tech (added 2026-11-17)
      "ashby:deepl", "ashby:alephalpha", "ashby:babbel", "ashby:doctolib", "ashby:qonto",
      "ashby:alan", "ashby:pennylane", "ashby:mollie", "greenhouse:adyen", "lever:spotify",
    ]

  # LinkedIn via jobdrop (no account used). Each search = ~2 requests; descriptions
  # are fetched only for jobs whose title + location already match a profile.
  # LinkedIn's remote filter is unreliable: a job only counts as remote if its
  # title/description says so (see yojobs/remote.py).
  # Keep the number of searches moderate: LinkedIn rate-limits heavy use.
  linkedin:
    enabled: true
    results_per_search: 50
    searches:
      # Berlin: any work mode (on-site, hybrid or remote)
      - {term: "DevOps Manager", location: Berlin}
      - {term: "SRE Manager", location: Berlin}
      - {term: "Engineering Manager Infrastructure", location: Berlin}
      - {term: "Engineering Manager Platform", location: Berlin}
      - {term: "Engineering Manager Cloud", location: Berlin}
      - {term: "Head of Platform", location: Berlin}
      - {term: "Head of Infrastructure", location: Berlin}
      - {term: "Teamleiter DevOps", location: Berlin}
      # Remote within Germany
      - {term: "DevOps Manager", location: Germany, remote: true}
      - {term: "SRE Manager", location: Germany, remote: true}
      - {term: "Engineering Manager Infrastructure", location: Germany, remote: true}
      - {term: "Engineering Manager Platform", location: Germany, remote: true}
      - {term: "Engineering Manager Cloud", location: Germany, remote: true}
      - {term: "Head of Platform", location: Germany, remote: true}
      - {term: "Head of Infrastructure", location: Germany, remote: true}
      - {term: "Teamleiter DevOps", location: Germany, remote: true}
      # Remote across the EU: only kept if the job's location says Germany/EU/Europe
      - {term: "DevOps Manager", location: European Union, remote: true}
      - {term: "Site Reliability Engineering Manager", location: European Union, remote: true}
      - {term: "Platform Engineering Manager", location: European Union, remote: true}
      - {term: "Infrastructure Engineering Manager", location: European Union, remote: true}
      # Other examples:
      # - {term: "Backend Engineer Python", location: Amsterdam}
      # - {term: "Data Engineer", location: "Munich, Bavaria, Germany"}
      # - {term: "Frontend Developer", location: Spain, remote: true}

  # Indeed via jobdrop. Fast (descriptions included). Indeed is per country:
  # country is the Indeed site to use (Germany, Netherlands, Spain, France, UK, USA, ...).
  indeed:
    enabled: true
    country: Germany
    results_per_search: 50
    searches:
      # Berlin: any work mode
      - {term: "DevOps Manager", location: Berlin}
      - {term: "SRE Manager", location: Berlin}
      - {term: "Engineering Manager Infrastructure", location: Berlin}
      - {term: "Engineering Manager Platform", location: Berlin}
      - {term: "Engineering Manager Cloud", location: Berlin}
      - {term: "Head of Platform", location: Berlin}
      - {term: "Head of Infrastructure", location: Berlin}
      - {term: "Teamleiter DevOps", location: Berlin}
      # Remote within Germany
      - {term: "DevOps Manager", location: Germany, remote: true}
      - {term: "SRE Manager", location: Germany, remote: true}
      - {term: "Engineering Manager Infrastructure", location: Germany, remote: true}
      - {term: "Engineering Manager Platform", location: Germany, remote: true}
      - {term: "Engineering Manager Cloud", location: Germany, remote: true}
      - {term: "Head of Platform", location: Germany, remote: true}
      - {term: "Head of Infrastructure", location: Germany, remote: true}
      - {term: "Teamleiter DevOps", location: Germany, remote: true}

# ---------------------------------------------------------------------------
# Search profiles: what counts as a match
# ---------------------------------------------------------------------------
# A job is reported if it passes ANY profile. Checks, in order:
#   1. none_of     - drop the job if any of these words appear (in exclude_in)
#   2. all_of      - every entry must appear (in all_of_in); "a|b" = either word.
#                    Sources without descriptions can't be checked: the job is kept
#                    and marked "<word> not verified" in the email.
#   3. place       - onsite_cities / remote_regions (see below)
#   4. groups      - the title (match_in) needs at least one word from EACH group:
#                    AND between groups, OR inside a group
#   5. any_of      - optional extra words; if set, at least min_score must match
# Words match whole words, case-insensitively; a space also matches a hyphen
# ("Site Reliability" matches "Site-Reliability"). Fields you can search:
# title, description, tags, company, location.
profiles:
  - name: platform-leadership
    groups:
      role:   # leadership roles only, no individual-contributor titles
        - Manager
        - Engineering Manager
        - Head of
        - Director
        - VP
        - Vice President
        - Team Lead
        - Teamleiter
        - Teamleitung
        - Leiter
        - Leitung
      area:   # platform / infrastructure domain
        - Platform
        - Plattform
        - Infrastructure
        - Infrastruktur
        - DevOps
        - SRE
        - Site Reliability
        - Reliability
        - Cloud
        - GCP
        - Kubernetes
    any_of: []
    all_of: ["Kubernetes|K8s"]
    all_of_in: [title, description, tags]
    none_of: [Account Executive, Product Manager, Head of Product, Growth, Sales, Marketing, Project Manager, Program Manager, Programme Manager, Procurement, Partner Manager, Alliances, Partnerships]
    exclude_in: [title]
    match_in: [title]          # add description / tags for wider (noisier) matching
    min_score: 1
    # Where you can work:
    #  - on-site / hybrid jobs: only in these cities (any work mode is fine there)
    onsite_cities: [Berlin]
    #  - remote jobs: the location (= where you may live) must mention one of these,
    #    or be plain "Remote". "Remote, Ireland" or "USA only" are dropped.
    #    An empty list accepts remote jobs from anywhere.
    remote_regions: [Germany, Deutschland, Europe, European, EU, EMEA, CET, Worldwide, Anywhere, Global]
    # Language (needs the ad text; jobs from sources without descriptions are kept):
    #  - skip ads written in these languages (de = German; bilingual ads are kept)
    # skip_ad_languages: [de]
    #  - skip ads that require fluency in a language ("fluent German", "Deutsch C1",
    #    "verhandlungssicheres Deutsch"); "German is a plus" does not count
    # skip_if_requires: [German]

  # --- More example profiles (uncomment and adapt) ---------------------------

  # Remote Python backend developer, anywhere in Europe. No groups: the title
  # just needs at least 2 of the any_of words (e.g. "Senior Python Backend Engineer").
  # - name: python-backend
  #   any_of: [Python, Django, FastAPI, Backend, Back End, Engineer, Developer]
