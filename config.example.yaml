# Copy to config.yaml and edit. config.yaml is git-ignored.

# Only keep jobs published within the last N days.
max_age_days: 3
# The very first run (nothing remembered yet) looks further back.
first_run_days: 30

# Email (Gmail SMTP). The password is NOT stored here: it is read from the macOS
# Keychain. Create a Gmail App Password, then run:
#   security add-generic-password -s yojobs-smtp -a you@gmail.com -w
email:
  username: you@gmail.com     # Gmail account used to send
  to: you@gmail.com           # where alerts go
  smtp_host: smtp.gmail.com
  smtp_port: 465

# Remembers jobs already emailed (git-ignored). A job's URL is never sent twice;
# the same company + title (e.g. on another portal) is blocked for dedupe_days.
database: seen.sqlite
dedupe_days: 60

# Portals. Set enabled: false to skip one. Extra keys are passed to the source.
sources:
  remotive:       {enabled: true}   # max ~4 runs/day per Remotive's terms
  himalayas:      {enabled: true, max_pages: 20}  # pages of 20 per keyword; stops early once jobs are older than the window
  jobicy:         {enabled: true, count: 100}   # optional: geo: europe
  weworkremotely: {enabled: true}
  workingnomads:  {enabled: true}
  landingjobs:    {enabled: true, max_pages: 6}
  4dayweek:       {enabled: true}
  startupmap:     {enabled: true}   # no descriptions: Kubernetes marked 'not verified'
  berlinstartupjobs: {enabled: true}
  # LinkedIn via jobdrop (no account used). Each search = ~2 requests; descriptions
  # are fetched only for jobs whose title + location already match.
  linkedin:
    enabled: true
    results_per_search: 50
    searches:
      # Berlin: any work mode (on-site, hybrid or remote)
      - {term: "DevOps Manager", location: Berlin}
      - {term: "SRE Manager", location: Berlin}
      - {term: "Engineering Manager Infrastructure", location: Berlin}
      - {term: "Engineering Manager Platform", location: Berlin}
      - {term: "Engineering Manager Cloud", location: Berlin}
      - {term: "Head of Platform", location: Berlin}
      - {term: "Head of Infrastructure", location: Berlin}
      - {term: "Teamleiter DevOps", location: Berlin}
      # Remote within Germany. LinkedIn also returns on-site jobs here; a job only
      # counts as remote if its title/description says so (see sources/linkedin.py)
      - {term: "DevOps Manager", location: Germany, remote: true}
      - {term: "SRE Manager", location: Germany, remote: true}
      - {term: "Engineering Manager Infrastructure", location: Germany, remote: true}
      - {term: "Engineering Manager Platform", location: Germany, remote: true}
      - {term: "Engineering Manager Cloud", location: Germany, remote: true}
      - {term: "Head of Platform", location: Germany, remote: true}
      - {term: "Head of Infrastructure", location: Germany, remote: true}
      - {term: "Teamleiter DevOps", location: Germany, remote: true}
      # Remote across the EU: only kept if the job's location says Germany/EU/Europe
      - {term: "DevOps Manager", location: European Union, remote: true}
      - {term: "Site Reliability Engineering Manager", location: European Union, remote: true}
      - {term: "Platform Engineering Manager", location: European Union, remote: true}
      - {term: "Infrastructure Engineering Manager", location: European Union, remote: true}
  # Indeed Germany via jobdrop. Fast (descriptions included). Outside Berlin a job
  # only counts as remote if its location/title/description clearly says so.
  indeed:
    enabled: true
    country: Germany
    results_per_search: 50
    searches:
      # Berlin: any work mode
      - {term: "DevOps Manager", location: Berlin}
      - {term: "SRE Manager", location: Berlin}
      - {term: "Engineering Manager Infrastructure", location: Berlin}
      - {term: "Engineering Manager Platform", location: Berlin}
      - {term: "Engineering Manager Cloud", location: Berlin}
      - {term: "Head of Platform", location: Berlin}
      - {term: "Head of Infrastructure", location: Berlin}
      - {term: "Teamleiter DevOps", location: Berlin}
      # Remote within Germany
      - {term: "DevOps Manager", location: Germany, remote: true}
      - {term: "SRE Manager", location: Germany, remote: true}
      - {term: "Engineering Manager Infrastructure", location: Germany, remote: true}
      - {term: "Engineering Manager Platform", location: Germany, remote: true}
      - {term: "Engineering Manager Cloud", location: Germany, remote: true}
      - {term: "Head of Platform", location: Germany, remote: true}
      - {term: "Head of Infrastructure", location: Germany, remote: true}
      - {term: "Teamleiter DevOps", location: Germany, remote: true}

# Search profiles. A job is reported if it passes ANY profile.
profiles:
  - name: platform-leadership
    # The title must match at least one word from EACH group (AND between groups,
    # OR inside a group). Every distinct match adds +1 to the score.
    groups:
      role:   # leadership roles only, no individual-contributor titles
        - Manager
        - Engineering Manager
        - Head of
        - Director
        - VP
        - Vice President
        - Team Lead
        - Teamleiter
        - Teamleitung
        - Leiter
        - Leitung
      area:   # platform / infrastructure domain
        - Platform
        - Plattform
        - Infrastructure
        - Infrastruktur
        - DevOps
        - SRE
        - Site Reliability
        - Reliability
        - Cloud
        - GCP
        - Kubernetes
    # Extra OR keywords that only add to the score (optional).
    any_of: []
    # AND keywords: all must appear (searched in title, description and tags).
    all_of: ["Kubernetes|K8s"]   # "a|b" = either word
    all_of_in: [title, description, tags]
    # Exclude jobs whose title contains any of these (see exclude_in).
    none_of: [Account Executive, Product Manager, Head of Product, Growth, Sales, Marketing, Project Manager, Program Manager, Programme Manager, Procurement]
    exclude_in: [title]
    match_in: [title]          # add description / tags for wider (noisier) matching
    min_score: 1
    # Where you can work:
    #  - on-site / hybrid jobs: only in these cities
    onsite_cities: [Berlin]
    #  - remote jobs: the location (= where you may live) must mention one of these,
    #    or be plain "Remote". "Remote, Ireland" or "USA only" are dropped.
    remote_regions: [Germany, Deutschland, Europe, European, EU, EMEA, CET, Worldwide, Anywhere, Global]
